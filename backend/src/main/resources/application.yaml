spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/onboarding
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# AWS Bedrock config (to be filled with real credentials in production)
bedrock:
  region: us-east-1
  access-key: YOUR_AWS_ACCESS_KEY
  secret-key: YOUR_AWS_SECRET_KEY
  model-id: LAGLamda-cddGen

# Camunda config
camunda:
  zeebe:
    client:
      broker:
        gateway-address: camunda:26500
      security:
        plaintext: true